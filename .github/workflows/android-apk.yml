name: Build VOX ROYALE Android APK

on:
  push:
    branches: [main, fix/android-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Install pinned Capacitor 7
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --legacy-peer-deps --no-audit --no-fund
      - name: Build web app and static Android shell
        run: npm run build
      - name: Verify Capacitor web assets
        run: |
          test -f .output/public/index.html
          test -s .output/public/index.html
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - name: Validate Android project
        working-directory: android
        run: ./gradlew --version
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vox-royale-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
