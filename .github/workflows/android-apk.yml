name: Sada Chat CI and APK

on:
  push:
    branches:
      - empty
      - login-page-lovable-copy
      - app_new
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke
        run: |
          echo "GitHub Actions runner reached successfully"
          echo "SHA=$GITHUB_SHA"

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source without external actions
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          test -f package.json
          test -f mobile/build-android.sh
          test -f mobile/android/gradlew
          test -f mobile/android/app/build.gradle

      - name: Prepare installed build tools
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -x "$JAVA_HOME_21_X64/bin/java" ]; then
            JDK_HOME="$JAVA_HOME_21_X64"
          elif [ -n "${JAVA_HOME_17_X64:-}" ] && [ -x "$JAVA_HOME_17_X64/bin/java" ]; then
            JDK_HOME="$JAVA_HOME_17_X64"
          else
            JDK_HOME="$JAVA_HOME"
          fi
          test -x "$JDK_HOME/bin/java"
          echo "JAVA_HOME=$JDK_HOME" >> "$GITHUB_ENV"
          echo "$JDK_HOME/bin" >> "$GITHUB_PATH"
          "$JDK_HOME/bin/java" -version
          "$JDK_HOME/bin/javac" -version
          test -n "${ANDROID_HOME:-}" || test -n "${ANDROID_SDK_ROOT:-}"

      - name: Build Android APK
        shell: bash
        working-directory: source
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://pkqcxcfuelubonlkjgoq.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_rTPtpxMftXim8X_Re9LxMg_vZaF_ade' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'pkqcxcfuelubonlkjgoq' }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_SUPABASE_PROJECT_ID"
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
            printf 'VITE_SUPABASE_PROJECT_ID=%s\n' "$VITE_SUPABASE_PROJECT_ID"
          } > .env
          bash mobile/build-android.sh

      - name: Verify and publish APK
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          echo "=== Android APK signing certificate (register this SHA-1 in Google Cloud Android OAuth client) ==="
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #|SHA-1|SHA-256"
          else
            echo "::warning::apksigner was not found; could not print the APK SHA-1."
          fi
          TAG="sada-chat-apk-${GITHUB_SHA::7}"
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "Sada Chat APK ${GITHUB_SHA::7}" --notes "Capacitor Android wrapper built from branch $GITHUB_REF_NAME at commit $GITHUB_SHA."
