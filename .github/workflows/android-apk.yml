name: Build VOX ROYALE Android APK

on:
  push:
    branches: [admin-asset-center]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vox-royale-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: admin-asset-center
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify project inputs
        run: |
          set -euo pipefail
          test -s package.json
          test -s bun.lock
          test -s capacitor.config.json
          test -s public/sdy-chat-icon.svg
          test -s public/control-center/index.html
          java -version
          bun --version
          adb version || true

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun add --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          bunx cap --version

      - name: Build web application
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          NITRO_PRESET: render-com
        run: |
          set -euo pipefail
          bun run build
          test -s .output/public/index.html
          test -s .output/public/control-center/index.html
          if grep -RqiE 'lovable\\.app|lovable\\.dev' .output/public 2>/dev/null; then
            echo "::error::Lovable preview branding or host reference remains in the Android web bundle."
            exit 1
          fi

      - name: Prepare Android project
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            bunx cap add android
          fi
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          perms = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          marker = "<application"
          missing = [p for p in perms if p not in xml]
          if missing:
              xml = xml.replace(marker, "\n".join(missing) + "\n    " + marker, 1)
              manifest.write_text(xml)
          PY
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            convert public/sdy-chat-icon.svg -background none -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          VERSION_CODE="$(node -p "const p=process.argv[1].split('.').map(Number); (p[0]||0)*10000+(p[1]||0)*100+(p[2]||0)" "$VERSION")"
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Sync web bundle into Android
        run: |
          set -euo pipefail
          bunx cap sync android
          test -s android/app/src/main/assets/public/index.html

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vox-royale-android-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TAG="vox-royale-apk-${GITHUB_SHA::7}"
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "VOX ROYALE Android APK ${GITHUB_SHA::7}" --notes "Android APK built from commit $GITHUB_SHA on branch $GITHUB_REF_NAME."
