name: Build VOX ROYALE Android APK

on:
  push:
    branches: [admin-asset-center]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vox-royale-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source without external actions
        run: |
          BRANCH="$GITHUB_REF_NAME"
          git clone --depth 1 --branch "$BRANCH" "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          test -f package.json
          test -f bun.lock
          test -f capacitor.config.json

      - name: Install locked dependencies and build web application
        working-directory: source
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version
          bun install --frozen-lockfile
          bun run build

      - name: Select compatible Java 21
        run: |
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -x "$JAVA_HOME_21_X64/bin/java" ]; then
            JDK_HOME="$JAVA_HOME_21_X64"
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk
            JDK_HOME="/usr/lib/jvm/java-21-openjdk-amd64"
          fi
          echo "JAVA_HOME=$JDK_HOME" >> "$GITHUB_ENV"
          echo "$JDK_HOME/bin" >> "$GITHUB_PATH"

      - name: Prepare Android toolchain
        working-directory: source
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          java -version 2>&1 | grep -q '21\\.'
          test -n "$ANDROID_HOME" || test -n "$ANDROID_SDK_ROOT"
          APP_URL="$(node -e "const c=require('./capacitor.config.json'); process.stdout.write(c.server?.url || '')")"
          if [ -z "$APP_URL" ] || [[ "$APP_URL" == *lovable.app* ]] || [[ "$APP_URL" == *lovable.dev* ]]; then
            echo "::error::The APK must point to the independent VOX ROYALE host, not the Lovable preview. Deploy the Render service and set server.url in capacitor.config.json first."
            exit 1
          fi
          case "$APP_URL" in https://*) ;; *) echo "::error::VOX_APP_URL must use HTTPS"; exit 1;; esac
          curl --fail --silent --show-error "$APP_URL/" -o /dev/null
          bun add @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          bunx cap add android

      - name: Sync Android project
        working-directory: source
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx cap sync android

      - name: Build debug APK
        working-directory: source/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TAG="vox-royale-apk-${GITHUB_SHA::7}"
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "VOX ROYALE Android APK ${GITHUB_SHA::7}" --notes "Automated debug APK build for commit $GITHUB_SHA on branch $GITHUB_REF_NAME."
