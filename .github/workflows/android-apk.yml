name: Build VOX ROYALE Android APK

on:
  push:
    branches: [admin-asset-center]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vox-royale-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # verified rebuild after storage/gift/security fixes
    steps:
      - name: Checkout source without external actions
        run: |
          BRANCH="$GITHUB_REF_NAME"
          git clone --depth 1 --branch "$BRANCH" "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          test -f package.json
          test -f bun.lock
          test -f capacitor.config.json
          test -s public/control-center/index.html

      - name: Install locked dependencies and build static app shell
        working-directory: source
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version
          bun install --frozen-lockfile
          export VITE_APP_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "Building app version $VITE_APP_VERSION"
          bun run build
          test -s .output/public/index.html
          if grep -Eqi 'lovable\\.app|lovable\\.dev' .output/public/index.html; then
            echo "::error::Lovable preview branding or host reference remains in the Android app shell."
            exit 1
          fi

      - name: Select compatible Java 21
        run: |
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -x "$JAVA_HOME_21_X64/bin/java" ]; then
            JDK_HOME="$JAVA_HOME_21_X64"
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk
            JDK_HOME="/usr/lib/jvm/java-21-openjdk-amd64"
          fi
          echo "JAVA_HOME=$JDK_HOME" >> "$GITHUB_ENV"
          echo "$JDK_HOME/bin" >> "$GITHUB_PATH"

      - name: Prepare Android toolchain
        working-directory: source
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          java -version 2>&1 | grep -Eq 'version "21([.]|")'
          test -n "$ANDROID_HOME" || test -n "$ANDROID_SDK_ROOT"
          bun add @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          bunx cap add android
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"; size="${spec##*:}"
            convert public/sdy-chat-icon.svg -background none -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          VERSION_CODE="$(node -p "const p=process.argv[1].split('.').map(Number); p[0]*10000+p[1]*100+p[2]" "$VERSION")"
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Sync bundled web assets into Android
        working-directory: source
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx cap sync android
          test -s android/app/src/main/assets/public/index.html

      - name: Build debug APK
        working-directory: source/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TAG="vox-royale-apk-${GITHUB_SHA::7}"
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "VOX ROYALE Android APK ${GITHUB_SHA::7}" --notes "Bundled Android APK for commit $GITHUB_SHA on branch $GITHUB_REF_NAME. App UI is packaged locally; Supabase services require internet access."


