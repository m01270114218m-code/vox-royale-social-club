name: Build VOX ROYALE Android APK

on:
  push:
    branches: [admin-asset-center]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vox-royale-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verify web production build
        run: npm run build

      - name: Install Capacitor toolchain
        run: npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --no-audit --no-fund

      - name: Verify Capacitor configuration
        run: node -e "const c=require('./capacitor.config.json'); if(c.appId!=='com.voxroyale.app'||!c.server?.url?.startsWith('https://')) process.exit(1); console.log('Capacitor remote app URL configured:', c.server.url)"

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vox-royale-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
