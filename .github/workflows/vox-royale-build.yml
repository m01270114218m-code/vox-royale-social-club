name: VOX ROYALE Android APK build

on:
  push:
    branches: [admin-asset-center]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vox-royale-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        run: |
          BRANCH="$GITHUB_REF_NAME"
          git clone --depth 1 --branch "$BRANCH" "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          test -f package.json
          test -f bun.lock

      - name: Install dependencies and build web
        working-directory: source
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          bun install
          export NITRO_PRESET=render-com
          bun run build
          test -s .output/public/control-center/index.html

      - name: Prepare Capacitor Android
        working-directory: source
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          test -f android/gradlew

      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vox-royale-admin-asset-center-debug
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
