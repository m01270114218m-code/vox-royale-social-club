name: VOX ROYALE web build

on:
  push:
    branches: [admin-asset-center]
  pull_request:
    branches: [zen, admin-asset-center]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vox-royale-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build web application
        run: npm run build
