name: VOX ROYALE web build

on:
  push:
    branches: [admin-asset-center]
  pull_request:
    branches: [zen, admin-asset-center]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vox-royale-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web application
        run: bun run build
