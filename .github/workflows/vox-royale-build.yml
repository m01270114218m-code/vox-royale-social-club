name: VOX ROYALE web build

on:
  push:
    branches: [admin-asset-center]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vox-royale-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source without external actions
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$BRANCH" "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          test -f package.json
          test -f bun.lock

      - name: Install dependencies and build
        working-directory: source
        run: |
          node --version
          npm --version
          npm install --no-package-lock --no-audit --no-fund
          npm run build
