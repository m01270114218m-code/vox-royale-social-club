name: VOX ROYALE Actions smoke check

on:
  push:
    branches: [admin-asset-center]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm runner and official actions
        run: node --version
