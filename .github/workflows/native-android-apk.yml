name: VOX ROYALE Native Android APK

on:
  push:
    branches:
      - native-android-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" source
          cd source
          git rev-parse HEAD

      - name: Verify runner tools
        run: |
          java -version
          command -v sdkmanager || true
          command -v gradle || true
          command -v gh || true

      - name: Install Android SDK packages
        working-directory: source
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        working-directory: source
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          rm -rf /tmp/gradle-8.13
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.13/bin/gradle --version

      - name: Build native APK
        working-directory: source/native-android
        run: |
          /tmp/gradle-8.13/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: source
        run: |
          test -s native-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh native-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK release asset
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="native-build-${GITHUB_SHA::12}"
          gh release create "$TAG" native-android/app/build/outputs/apk/debug/app-debug.apk#vox-royale-native-debug.apk --title "VOX ROYALE Native APK $GITHUB_SHA" --notes "Automated native Android debug APK build from native-android-build." --target "$GITHUB_SHA"
