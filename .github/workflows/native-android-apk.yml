name: Build VOX ROYALE Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-android-foundation
      - vox-royale-native-yalla-chat
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: vox-royale-native-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-apk:
    name: Compile and package native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify build toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run native unit tests
        working-directory: native-android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile native debug APK
        working-directory: native-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s native-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh native-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: vox-royale-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
