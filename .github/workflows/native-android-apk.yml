name: Build VOX ROYALE Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [native-android-foundation]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-apk.yml"

permissions:
  contents: read

jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build native debug APK
        working-directory: native-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: test -s native-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vox-royale-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
