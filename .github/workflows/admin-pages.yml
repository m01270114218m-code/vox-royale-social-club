name: Deploy VOX ROYALE External Admin

on:
  push:
    branches: [admin-asset-center]
    paths:
      - "admin-panel/**"
      - ".github/workflows/admin-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "admin-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload admin site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./admin-panel"
      - name: Deploy admin site
        id: deployment
        uses: actions/deploy-pages@v4
