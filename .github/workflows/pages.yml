name: Deploy standalone Dragon Tiger game

on:
  push:
    branches:
      - standalone-dragon-tiger-game
    paths:
      - "dragon-tiger-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dragon-tiger-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish Dragon Tiger
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify site entry point
        run: test -s dragon-tiger-site/index.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dragon-tiger-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
