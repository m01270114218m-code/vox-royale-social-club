name: External Admin Console
on:
  push:
    branches: [external-admin-console]
    paths:
      - "admin-app/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-console.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: admin-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run admin:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin-app/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
