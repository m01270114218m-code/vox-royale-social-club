name: Sada Chat APK Build

on:
  push:
    branches:
      - empty
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository
        shell: bash
        run: |
          set -e
          test -f package.json
          test -f mobile/build-android.sh
          test -f mobile/android/app/build.gradle || test -f mobile/android/app/build.gradle.kts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -e
          bash mobile/build-android.sh

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sada-chat-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
