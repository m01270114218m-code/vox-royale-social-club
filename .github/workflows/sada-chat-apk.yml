name: Build Sada Chat APK

on:
  push:
    branches: [empty]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Verify backend secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub repository secret: $name"
              exit 1
            fi
          done
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID"
          } > .env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      - name: Build Android APK
        run: bash mobile/build-android.sh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sada-chat-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TAG="sada-chat-${GITHUB_SHA:0:7}"
          gh release create "$TAG" "$APK" --title "Sada Chat Android ${GITHUB_SHA:0:7}" --notes "APK built from branch ${GITHUB_REF_NAME} at commit ${GITHUB_SHA}." --target "$GITHUB_SHA"
